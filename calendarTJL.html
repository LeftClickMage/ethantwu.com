<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple: #5b5fc7; --purple-dark: #444791; --rail: #ebebeb; --bg: #f5f5f5;
    --line: #e1e1e1; --text: #242424; --muted: #616161; --now: #c4314b;
  }
  html, body { height: 100%; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; color: var(--text); background: var(--bg); overflow: hidden; }
  .app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }

  /* Top bar */
  .topbar { background: var(--purple-dark); display: flex; align-items: center; padding: 0 16px; gap: 16px; color: #fff; }
  .topbar .waffle { width: 20px; height: 20px; display: grid; grid-template-columns: repeat(3, 4px); gap: 3px; }
  .topbar .waffle i { width: 4px; height: 4px; background: #fff; border-radius: 1px; }
  .topbar .appname { font-weight: 600; font-size: 15px; width: 180px; }
  .search { flex: 1; max-width: 560px; margin: 0 auto; background: rgba(255,255,255,.92); color: var(--muted); border-radius: 4px; height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; gap: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #c19c00; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; position: relative; }
  .avatar::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); border: 2px solid var(--purple-dark); }

  .main { display: grid; grid-template-columns: 68px 1fr; min-height: 0; }

  /* Left rail */
  .rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 2px; }
  .rail a { width: 68px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: var(--muted); text-decoration: none; position: relative; }
  .rail a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .rail a.active { color: var(--purple); }
  .rail a.active::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; background: var(--purple); border-radius: 0 2px 2px 0; }
  .badge { position: absolute; top: 6px; right: 16px; background: var(--now); color: #fff; font-size: 9px; font-weight: 700; border-radius: 8px; padding: 1px 5px; }

  /* Calendar */
  .cal { background: #fff; display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
  .calhead { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .calhead h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .btn { border: 1px solid #d1d1d1; background: #fff; border-radius: 4px; padding: 5px 12px; font-size: 14px; font-weight: 600; color: var(--text); font-family: inherit; }
  .btn.primary { background: var(--purple); border-color: var(--purple); color: #fff; }
  .spacer { flex: 1; }
  .nav { display: flex; align-items: center; gap: 14px; font-size: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  .nav .arrows { color: var(--muted); letter-spacing: 6px; font-size: 16px; }
  .nav .month { font-weight: 600; }

  .grid-wrap { display: grid; grid-template-columns: 64px 1fr; grid-template-rows: 58px 1fr; min-height: 0; }
  .days { grid-column: 2; display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
  .day-h { padding: 8px 10px; border-left: 1px solid var(--line); }
  .day-h .num { font-size: 22px; font-weight: 300; line-height: 1; }
  .day-h .name { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .day-h.today .num, .day-h.today .name { color: var(--purple); font-weight: 600; }
  .day-h.today { border-top: 3px solid var(--purple); padding-top: 5px; }

  .times { grid-row: 2; position: relative; }
  .times div { position: absolute; right: 8px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .body { grid-row: 2; grid-column: 2; display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
  .col { border-left: 1px solid var(--line); position: relative;
         background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(100% / 20)); }
  .col.today { background-color: #fafaff; }

  .ev { position: absolute; border-radius: 4px; padding: 3px 7px; font-size: 12px; line-height: 1.25; overflow: hidden;
        border-left: 4px solid var(--c); background: var(--bg-c); color: #242424; box-shadow: 0 0 0 1px #fff; }
  .ev b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev span { color: #424242; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .ev.short { padding-top: 1px; }
  .ev.short span { display: none; }

  .now { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 5; }
  .now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="waffle"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="appname">Teams</div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#616161" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      Search
    </div>
    <div class="avatar" id="avatar"></div>
  </header>

  <div class="main">
    <nav class="rail">
      <a href="#"><span class="badge">12</span><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/></svg>Activity</a>
      <a href="#"><span class="badge">7</span><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Chat</a>
      <a href="#"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1 6 4"/></svg>Teams</a>
      <a href="#" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>Calls</a>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6zM14 3v5h5"/></svg>Files</a>
    </nav>

    <section class="cal">
      <div class="calhead">
        <h1>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b5fc7" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Calendar
        </h1>
        <div class="spacer"></div>
        <button class="btn">Meet now</button>
        <button class="btn primary">+ New meeting</button>
      </div>
      <div class="nav">
        <button class="btn">Today</button>
        <span class="arrows">‹ ›</span>
        <span class="month" id="month"></span>
        <div class="spacer"></div>
        <span style="color:var(--muted)">Work week ▾</span>
      </div>

      <div class="grid-wrap">
        <div class="days" id="days"></div>
        <div class="times" id="times"></div>
        <div class="body" id="body"></div>
      </div>
    </section>
  </div>
</div>

<script>
  // ---- Edit these for the scene ----
  const USER_INITIALS = 'TL';
  const WEEK_START = new Date(2026, 10, 23); // Monday, Nov 23 2026
  const TODAY_INDEX = 3;                     // 0 = Mon ... 4 = Fri
  const NOW = '10:47';                       // red "current time" line
  const START_HOUR = 8, END_HOUR = 18;

  const C = {
    purple: ['#5b5fc7', '#e8ebfa'], teal: ['#038387', '#d4eeee'], orange: ['#ca5010', '#fde7dc'],
    red: ['#c4314b', '#f9e1e5'], green: ['#107c10', '#dff3dd'], blue: ['#0f6cbd', '#dbeaf7']
  };

  // [day, start, end, title, subtitle, color]
  const events = [
    [4, '8:00', '18:00', 'Completely full', '', 'purple'],
  ];
  // -----------------------------------

  const $ = id => document.getElementById(id);
  const toH = t => { const [h, m] = t.split(':').map(Number); return h + m / 60; };
  const pct = t => ((toH(t) - START_HOUR) / (END_HOUR - START_HOUR)) * 100;
  const fmt = t => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };

  $('avatar').textContent = USER_INITIALS;
  const fri = new Date(WEEK_START); fri.setDate(fri.getDate() + 4);
  $('month').textContent = `${WEEK_START.toLocaleDateString('en-US', { month: 'long' })} ${WEEK_START.getDate()}–${fri.getDate()}, ${fri.getFullYear()}`;

  const names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  names.forEach((n, i) => {
    const d = new Date(WEEK_START); d.setDate(d.getDate() + i);
    $('days').insertAdjacentHTML('beforeend',
      `<div class="day-h ${i === TODAY_INDEX ? 'today' : ''}"><div class="num">${d.getDate()}</div><div class="name">${n}</div></div>`);
    $('body').insertAdjacentHTML('beforeend', `<div class="col ${i === TODAY_INDEX ? 'today' : ''}" id="col${i}"></div>`);
  });

  for (let h = START_HOUR + 1; h < END_HOUR; h++) {
    const label = `${h % 12 || 12} ${h >= 12 ? 'PM' : 'AM'}`;
    $('times').insertAdjacentHTML('beforeend', `<div style="top:${((h - START_HOUR) / (END_HOUR - START_HOUR)) * 100}%">${label}</div>`);
  }

  for (const [day, s, e, title, sub, color, col = 0, cols = 1] of events) {
    const [c, bg] = C[color];
    const short = toH(e) - toH(s) <= 0.5;
    $('col' + day).insertAdjacentHTML('beforeend',
      `<div class="ev ${short ? 'short' : ''}" style="--c:${c};--bg-c:${bg};top:${pct(s)}%;height:${pct(e) - pct(s)}%;left:calc(${(col / cols) * 100}% + 2px);width:calc(${100 / cols}% - 4px)">
         <b>${title}</b><span>${fmt(s)} – ${fmt(e)}</span>${sub ? `<span>${sub}</span>` : ''}</div>`);
  }

  $('col' + TODAY_INDEX).insertAdjacentHTML('beforeend', `<div class="now" style="top:${pct(NOW)}%"></div>`);
</script>
</body>
</html>
